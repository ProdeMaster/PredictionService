# Nombre del servicio para Eureka
spring.application.name=prediction-service
server.port=8082

#Configuracion general
spring.config.import=optional:configserver:

#Conectividad con zipkin para manejo de trazabilidad
spring.zipkin.base-url=http://localhost:9411
#spring.zipkin.base-url=http://zipkin:9411
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
#management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.tracing.sampling.probability=1.0

#Actuator (para exponer metricas y trazas)
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.export.prometheus.enabled=true

#Configuracion de Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
#eureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka/
eureka.instance.prefer-ip-address=true

#Configuracion de la base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/prodeMaster_predication_db
#spring.datasource.url=jdbc:postgresql://postgres:5433/prodeMaster_predication_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Configuracion de Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping.event=com.ProdeMaster.PredictionService.infrastructure.messaging.event.Event

# Kafka Consumer
spring.kafka.consumer.group-id=prediction-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Topics
app.kafka.topic.prediction-events=prediction.events
app.kafka.topic.match-events=match.events

# Configuracion de Valkey (Redis)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.cache.ttl=120

# Match Service URL (para REST calls)
app.match-service.url=http://localhost:8083/api/v1/matches

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50

# Group Service (Eureka service name for load-balanced HTTP calls)
app.group-service.name=group-service

# Prediction Service config
app.prediction.buffer-minutes-before-match=5